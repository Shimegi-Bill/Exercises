<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="復康運動">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111814" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- 版本號：每次改完 index.html 上載之前一定要改（手機靠佢自動更新） -->

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>復康運動</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one phone column; big bottom action bar; full-screen session mode with a large picture and timer */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#18241E; --muted:#5D6B63; --line:#D5DDD8;
  --accent:#2C6E55; --accent-ink:#FFFFFF; --rest:#B8741F; --rest-soft:#F6E9D6; --danger:#B33A3A;
  --fig:#3A4842; --hl:#1F8A5E; --arrow:#C27A1E; --zone:#F3C98A; --wall:#D7DED9; --pic-bg:#F7FAF8;
  --accent-soft:#CFE6DB;
  --f-body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Noto Sans HK",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#1A231E; --ink:#E8EFEA; --muted:#9AA9A0; --line:#2C3832;
  --accent:#5FB894; --accent-ink:#0D1611; --rest:#E0A04F; --rest-soft:#2E2617; --danger:#E07272;
  --fig:#C9D4CE; --hl:#6BD3A4; --arrow:#E8A955; --zone:#6A4E22; --wall:#2C3832; --pic-bg:#141C18; --accent-soft:#2F6650; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#1A231E; --ink:#E8EFEA; --muted:#9AA9A0; --line:#2C3832;
  --accent:#5FB894; --accent-ink:#0D1611; --rest:#E0A04F; --rest-soft:#2E2617; --danger:#E07272;
  --fig:#C9D4CE; --hl:#6BD3A4; --arrow:#E8A955; --zone:#6A4E22; --wall:#2C3832; --pic-bg:#141C18; --accent-soft:#2F6650; color-scheme:dark}
html{font-size:17px}
html.big{font-size:21px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55}
html,body{touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body.locked{overflow:hidden}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:1rem 8rem}
h1{font-size:1.5rem;font-weight:900;margin:0;letter-spacing:.02em}
h2{font-size:1.15rem;margin:0;font-weight:700;text-wrap:balance}
.top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-block:.25rem .75rem}
.sub{color:var(--muted);font-size:.85rem}
button{font-family:inherit;font-size:1rem;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:0 1.1rem;border-radius:999px;font-weight:700;background:var(--surface);border:1.5px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:2.4rem;padding:0 .9rem;font-size:.9rem}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;max-width:190px;min-height:3.6rem;font-weight:700;color:var(--muted);font-size:min(.95rem,4.2vw);white-space:nowrap;padding:0 2px}
.tabs button[aria-current="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem;margin-bottom:.75rem}
.chip{flex:none;min-height:2.6rem;padding:0 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:.6rem}
.sec{font-size:.8rem;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-top:.5rem}
/* exercise card */
.ex{background:var(--surface);border-radius:var(--r);padding:.8rem;display:grid;grid-template-columns:7rem 1fr;gap:.3rem .9rem;align-items:start;text-align:left;width:100%}
.ex .thumb{grid-row:span 2;background:var(--pic-bg);border-radius:10px;overflow:hidden}
.ex.nopic{grid-template-columns:1fr}
.ex.nopic .thumb{display:none}
.ex .body{min-width:0}
.ex .meta{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.ex .note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:.6rem;white-space:pre-wrap;min-width:0}
.ex.open{grid-template-columns:1fr}
.ex.open .thumb{grid-row:auto;max-width:22rem;width:100%;justify-self:center}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:.05rem .5rem;border-radius:999px;background:var(--bg);color:var(--muted);margin-right:.35rem;vertical-align:.1em}
.tag.st{background:var(--rest-soft);color:var(--rest)}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin-top:.4rem}
.empty{background:var(--surface);border-radius:var(--r);padding:1.4rem;display:flex;flex-direction:column;gap:.8rem}
.dock{position:fixed;left:0;right:0;bottom:calc(3.6rem + env(safe-area-inset-bottom,0px));padding:.6rem 16px;display:flex;justify-content:center;z-index:4;background:linear-gradient(transparent,var(--bg) 35%)}
.dock .btn{width:100%;max-width:528px;min-height:3.6rem;font-size:1.15rem}
.save-note{font-size:.78rem;color:var(--muted);margin-top:1rem}
/* pictures */
.pic{display:block;width:100%;height:auto}
.pic .b{stroke:var(--fig)} .pic .r{stroke:var(--hl)}
.pic .hd{fill:var(--fig)}
.pic .far{opacity:.5} .pic .ghost{opacity:.2}
.pic .ar{stroke:var(--arrow);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.pic .ah{fill:var(--arrow)}
.pic .floor{stroke:var(--line);stroke-width:2}
.pic .wall{fill:var(--wall)} .pic .wallface{stroke:var(--fig);stroke-width:1.5;opacity:.5}
.pic .zone{fill:var(--zone)}
.pic text{font-family:var(--f-body);font-size:11px;fill:var(--muted);font-weight:500}
.pic .tr{fill:var(--hl);font-weight:700}
.pic .cap{font-size:12.5px;fill:var(--ink);font-weight:700}
/* editor */
.edit{background:var(--surface);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;gap:.7rem}
.edit .row{display:flex;gap:.6rem;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:.2rem;flex:1;min-width:0}
.field label,.flabel{font-size:.8rem;color:var(--muted);font-weight:500}
.field.num{flex:1 1 4.6rem;max-width:6.5rem}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:.55rem .7rem;width:100%;box-sizing:border-box}
input[type=number]{font-family:var(--f-num);font-size:1.25rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
textarea{min-height:3rem;resize:vertical}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.2rem,1fr));gap:.4rem}
.picks button{background:var(--pic-bg);border:2px solid var(--line);border-radius:10px;padding:2px;min-height:3.2rem;font-size:.8rem;color:var(--muted)}
.picks button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.kind{display:flex;gap:.4rem}
.kind .chip{min-height:2.3rem;font-size:.9rem}
.ed-actions{display:flex;gap:.4rem;justify-content:flex-end;flex-wrap:wrap}
.confirm{background:var(--rest-soft);border-radius:10px;padding:.7rem;display:flex;flex-direction:column;gap:.5rem}
.confirm .row{display:flex;gap:.5rem;flex-wrap:wrap}
/* history */
.day{font-size:.8rem;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:.6rem}
.hist{background:var(--surface);border-radius:var(--r);padding:.8rem 1rem}
.hist .h{display:flex;justify-content:space-between;gap:.5rem;font-weight:700}
.hist .h span{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;flex:none}
.hist ul{margin:.3rem 0 0;padding:0;list-style:none;font-size:.9rem;color:var(--muted)}
.hist li{display:flex;justify-content:space-between;gap:.5rem}
.ok{color:var(--accent);font-weight:700}
/* session */
.session{position:fixed;inset:0;height:100%;box-sizing:border-box;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 1.2vh) 16px calc(env(safe-area-inset-bottom,0px) + 1.6vh);overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.session.resting{background:var(--rest-soft)}
.s-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex:none}
.s-top .btn{min-height:min(2.4rem,6vh)}
.prog{display:flex;gap:3px;margin-top:1vh;flex:none}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--accent)}
.prog i.c{background:var(--rest)}
.s-main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1vh;padding-block:1vh}
.s-main>*{flex:none}
.tapzone{cursor:pointer}
.s-label{font-size:min(.85rem,2vh);letter-spacing:.12em;font-weight:700;color:var(--muted)}
.s-pic{flex:1 1 0!important;min-height:0;max-height:36vh;display:flex;justify-content:center;background:var(--pic-bg);border-radius:var(--r);padding:.3rem;max-width:100%;box-sizing:border-box}
.s-pic svg{height:100%;width:auto;max-width:100%;display:block}
.s-name{font-size:min(1.75rem,4vh);font-weight:900;line-height:1.2;text-wrap:balance}
.s-big{font-family:var(--f-num);font-weight:700;font-size:min(5rem,10.5vh);line-height:1;font-variant-numeric:tabular-nums}
.s-big small{font-size:.3em;font-family:var(--f-body);font-weight:700;margin-left:.3rem}
.s-big.hold{color:var(--accent)}
.s-big.relax{color:var(--muted)}
.s-state{font-size:min(1.2rem,2.9vh);font-weight:900;letter-spacing:.1em}
.s-state.hold{color:var(--accent)} .s-state.relax{color:var(--muted)} .s-state.tap{color:var(--accent)}
.s-sub{color:var(--muted);font-size:min(1rem,2.3vh)}
.s-note{max-width:30rem;color:var(--muted);font-size:min(.95rem,2.2vh);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sets{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.sets b{width:min(2.2rem,4.8vh);height:min(2.2rem,4.8vh);border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-num);font-size:min(1.1rem,2.6vh)}
.sets b.d{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sets b.c{border-color:var(--accent);color:var(--accent)}
.dial{position:relative;width:min(64vw,30vh,15rem);aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:min(4.2rem,9vh);color:var(--rest);font-variant-numeric:tabular-nums}
.s-bottom{display:flex;flex-direction:column;gap:1vh;width:100%;max-width:528px;margin:0 auto;flex:none}
.s-bottom .btn{min-height:min(4rem,9vh);font-size:min(1.25rem,3vh);width:100%}
.s-bottom .two{display:flex;gap:.5rem}
.s-bottom .two .btn{min-height:min(3.2rem,7vh);font-size:min(1rem,2.4vh);padding:0 .5rem}
.btn.rest{background:var(--rest);border-color:var(--rest);color:var(--accent-ink)}
.s-big.prep,.s-state.prep{color:var(--rest)}
/* resume banner */
.resume{background:var(--rest-soft);border-radius:var(--r);padding:.9rem 1rem;display:flex;flex-direction:column;gap:.5rem;margin-bottom:.8rem}
.resume .row,.hist .foot,.edit .btns{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.done-today{color:var(--accent);font-weight:700}
/* history stats + calendar */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.stat{background:var(--surface);border-radius:var(--r);padding:.6rem .4rem;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b small{font-family:var(--f-body);font-size:.45em;margin-left:.15rem}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.cal{background:var(--surface);border-radius:var(--r);padding:.8rem}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:.4rem}
.cal .wd{font-size:.72rem;color:var(--muted);text-align:center;font-weight:700}
.cal i{font-style:normal;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.85rem;font-family:var(--f-num);background:var(--bg);color:var(--muted);font-variant-numeric:tabular-nums}
.cal i.p{background:var(--accent-soft);color:var(--ink)}
.cal i.f{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal i.t{box-shadow:inset 0 0 0 2px var(--ink)}
.cal i.fu{opacity:.3}
.cal .legend{display:flex;gap:.8rem;justify-content:center;font-size:.75rem;color:var(--muted);margin-top:.5rem}
.cal .legend i{display:inline-block;width:.8rem;height:.8rem;aspect-ratio:auto;border-radius:3px;vertical-align:-.1em;margin-right:.25rem}
.hist .foot{justify-content:space-between;margin-top:.3rem}
/* settings */
.setrow{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.setrow>span{font-weight:500}
.setrow .kind{flex-wrap:wrap}
.setrow .chip{padding:0 .75rem}
.warn{color:var(--danger);font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>復康運動</h1><div class="sub" id="today"></div></div>
    <button class="btn small" id="fontBtn" aria-pressed="false">大字</button>
  </div>

  <section id="v-home"></section>
  <section id="v-plans" hidden></section>
  <section id="v-hist" hidden></section>
  <section id="v-set" hidden></section>
  <div class="save-note warn" id="saveNote" hidden></div>
</div>

<div class="dock" id="dock" hidden><button class="btn primary" id="startBtn">開始運動</button></div>

<nav class="tabs">
  <button data-v="home" aria-current="true">今日</button>
  <button data-v="plans">計劃 · 動作</button>
  <button data-v="hist">紀錄</button>
  <button data-v="set">設定</button>
</nav>

<div class="session" id="session" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtT=s=>{s=+s||0;const m=Math.floor(s/60),r=s%60;return m&&r?`${m}分${r}秒`:m?`${m}分鐘`:`${r}秒`};
const pad=n=>String(n).padStart(2,'0');
const RELAX=3; // 每下撐完之後放鬆幾秒

/* ---------- pictures (original line drawings; right leg highlighted) ---------- */
let mk=0;
const P=pts=>pts.map(p=>p.join(',')).join(' ');
const ln=(pts,c,w)=>`<polyline class="${c}" points="${P(pts)}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const hd=(x,y)=>`<circle class="hd" cx="${x}" cy="${y}" r="13"/>`;
function scene(inner,cap,wall,title){
  const id='ah'+(++mk);
  const w=wall==='r'?`<rect class="wall" x="150" y="14" width="16" height="194"/><line class="wallface" x1="150" y1="14" x2="150" y2="208"/>`
         :wall==='l'?`<rect class="wall" x="24" y="14" width="16" height="194"/><line class="wallface" x1="40" y1="14" x2="40" y2="208"/>`:'';
  return `<svg class="pic" viewBox="0 0 200 228" role="img" aria-label="${esc(title)}"><defs><marker id="${id}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
  ${w}<line class="floor" x1="8" y1="208" x2="192" y2="208"/>${inner.replace(/MARK/g,`url(#${id})`)}
  <text class="cap" x="100" y="224" text-anchor="middle">${cap}</text></svg>`;
}
const PICS={
  heelRaise:{label:'踮腳',draw:()=>scene(
    `<g class="ghost">${hd(88,36)}${ln([[88,52],[88,120]],'b',14)}${ln([[88,60],[110,86],[146,92]],'b',8)}${ln([[88,120],[92,162],[74,182],[80,192]],'b',10)}${ln([[88,120],[88,163],[88,201]],'r',10)}${ln([[83,207],[105,207]],'r',7)}</g>
     <g class="far">${ln([[88,107],[92,149],[74,169],[80,179]],'b',10)}</g>
     ${ln([[88,39],[88,107]],'b',14)}${hd(88,23)}
     ${ln([[88,107],[88,150],[89,189]],'r',10)}${ln([[86,192],[102,207],[110,207]],'r',7)}
     ${ln([[88,47],[110,73],[146,80]],'b',8)}
     <path class="ar" d="M52,200 V172" marker-start="MARK" marker-end="MARK"/>
     <text x="40" y="164">上落</text><text class="tr" x="98" y="150">右腳</text><text x="104" y="110">扶牆</text>`,
    '右腳單腳企，踮起腳踭','r','右腳單腳企，腳踭慢慢向上撐再落返地')},
  sideRaise:{label:'橫抬',draw:()=>scene(
    `<text x="10" y="22">（背面睇）</text>
     ${hd(84,34)}${ln([[84,50],[84,118]],'b',15)}${ln([[69,60],[99,60]],'b',10)}${ln([[76,118],[92,118]],'b',11)}
     ${ln([[69,60],[60,88],[74,110]],'b',8)}${ln([[99,60],[108,88],[94,110]],'b',8)}
     ${ln([[76,118],[76,162],[76,201]],'b',10)}${ln([[72,207],[80,207]],'b',8)}
     <g class="ghost">${ln([[92,118],[92,162],[92,201]],'r',10)}${ln([[88,207],[96,207]],'r',8)}</g>
     ${ln([[92,118],[112.8,154],[133.5,190]],'r',10)}${ln([[133.5,190],[137,197]],'r',8)}
     <path class="ar" d="M104.5,197 A80,80 0 0 0 126,190.5" marker-end="MARK"/>
     <text class="tr" x="142" y="176">右腳</text><text x="120" y="120">伸直向右抬</text>`,
    '右腳伸直，向右橫抬',null,'背面睇：企直，右腳伸直向右橫抬，撐住再放低')},
  backKick:{label:'後撐',draw:()=>scene(
    `<g class="far">${ln([[95,60],[118,84],[146,90]],'b',8)}${ln([[95,120],[95,163],[95,201]],'b',10)}${ln([[90,207],[112,207]],'b',7)}</g>
     ${ln([[95,52],[95,120]],'b',14)}${hd(95,36)}
     ${ln([[95,120],[77.7,157.2],[60.3,194.3]],'r',10)}${ln([[60.3,194.3],[58,199],[73,202]],'r',7)}
     ${ln([[95,60],[120,80],[146,84]],'b',8)}
     <path class="ar" d="M89.3,174.7 A55,55 0 0 1 72.6,170.2" marker-end="MARK"/>
     <text class="tr" x="22" y="178">右腳</text><text x="14" y="118">伸直向後撐</text><text x="104" y="110">扶牆</text>`,
    '企直，右腳伸直向後撐','r','企直，右腳伸直向後用力撐住')},

const store={mode:'none',stateRef:null,histRef:null,chain:Promise.resolve(),timers:{}};
let saveMsg='';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function warn(msg){const n=$('#saveNote');n.textContent=msg||'';n.hidden=!msg}
function doSave(which){
  clearTimeout(store.timers[which]);delete store.timers[which];
  const body=clone(which==='state'?S:H);
  if(!lsSet('rehab-'+which,body)&&store.mode!=='db')warn('呢部機嘅儲存空間滿咗，請去「設定」匯出備份，再喺「紀錄」刪除舊紀錄。');
  const ref=which==='state'?store.stateRef:store.histRef;
  if(store.mode==='db'&&ref){
    store.chain=store.chain.then(()=>ref.set(body)).catch(e=>{
      warn(e&&e.code==='quota_exceeded'?'雲端儲存已滿，請刪除舊紀錄。':'暫時存唔到上雲端，已經存喺呢部機。');
    });
  }
}
function queueSave(which){clearTimeout(store.timers[which]);store.timers[which]=setTimeout(()=>doSave(which),500)}
function flushSaves(){Object.keys(store.timers).forEach(doSave)}
async function initStore(){
  const ls=lsGet('rehab-state'),lh=lsGet('rehab-hist');
  if(ls)S=Object.assign(S,ls);else S=clone(DEFAULT);
  if(lh)H=lh;
  norm();loadResume();applyFont();render();
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id)throw 0;
    const col=db.collection('data/users/'+id);
    store.stateRef=col.doc('state');store.histRef=col.doc('history');
    const [a,b]=await Promise.all([store.stateRef.get(),store.histRef.get()]);
    store.mode='db';
    if(a.exists){S=Object.assign({plans:[],activeId:null,big:false},clone(a.data()))}
    else{queueSave('state')}
    if(b.exists){H=clone(b.data());if(!Array.isArray(H.log))H.log=[]}
    else if(H.log.length){queueSave('hist')}
    saveMsg='已自動儲存，換手機或電腦打開都見到。';
  }catch(e){
    store.mode='local';
    saveMsg='資料自動存喺呢部手機嘅瀏覽器（清除瀏覽器資料或者刪除主畫面圖示會冇埋），記得間中匯出備份。';
  }

}

    items:s.items.map((i,k)=>({name:i.name||'未命名',sets:+i.sets,reps:+i.reps,done:(s.done&&s.done[k])||0}))};

function addLog(e){
  if(!e.items.some(i=>i.done>0))return false;
  H.log=H.log.filter(l=>l.t!==e.t);H.log.push(e);H.log.sort((a,b)=>b.t-a.t);

  const byDay=new Map();
  H.log.forEach(l=>{const k=dayKey(l.t);const o=byDay.get(k)||{n:0,full:false};o.n++;if(logDone(l)>=logTotal(l))o.full=true;byDay.set(k,o)});
  const now=new Date(),today0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const wkStart=addDays(today0,-((now.getDay()+6)%7)); // 星期一開始
  let week=0;for(let i=0;i<7;i++)if(byDay.has(dayKey(addDays(wkStart,i))))week++;
  let streak=0,d=byDay.has(dayKey(today0))?today0:addDays(today0,-1);
  while(byDay.has(dayKey(d))){streak++;d=addDays(d,-1)}
  return {byDay,today0,wkStart,week,streak};
}
function renderHist(){
  const el=$('#v-hist');

      <div class="legend"><span><i class="f"></i>全部做完</span><span><i class="p"></i>做咗一部分</span></div></div>`;
  let lastDay='';

      <ul>${l.items.map(i=>`<li><span>${esc(i.name)}</span><span>${i.done>=i.sets?'<span class="ok">✓</span> ':''}${i.done}/${i.sets} 組</span></li>`).join('')}</ul>
      <div class="foot"><div class="sub">${done>=tot?'<span class="ok">全部完成</span>':`完成 ${done}/${tot} 組`}</div><button class="btn small danger" data-delhist="${l.t}">刪除</button></div></div>`;
  });
  el.innerHTML=`<div class="list">${out}</div>`;
}

/* ---------- sound & voice ---------- */
let actx=null,wake=null,zhVoice=null;
function pickVoice(){try{zhVoice=speechSynthesis.getVoices().find(v=>/zh[-_]HK|yue/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}}
function beep(freq=880,ms=180){try{if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.connect(g);g.connect(actx.destination);const t=actx.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);o.start(t);o.stop(t+ms/1000+.05)}catch(e){}}
function say(text,force){try{if(!S.voice&&!force)return;if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-HK';if(!zhVoice)pickVoice();if(zhVoice)u.voice=zhVoice;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
async function keepAwake(on){try{if(on&&'wakeLock' in navigator){wake=await navigator.wakeLock.request('screen')}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
const D='零一二三四五六七八九';
function num(n){
  n=Math.round(+n)||0;if(n<0||n>=1000)return String(n);
  if(n<10)return D[n];
  if(n<20)return '十'+(n%10?D[n%10]:'');
  if(n<100)return D[Math.floor(n/10)]+'十'+(n%10?D[n%10]:'');
  const h=Math.floor(n/100),r=n%100;
  return D[h]+'百'+(r===0?'':r<10?'零'+D[r]:D[Math.floor(r/10)]+'十'+(r%10?D[r%10]:''));
}

/* ---------- session ---------- */
// 狀態：phase = work／rest／done；work 入面 hp = ready（等撳）／prep（準備倒數）／hold（撐住）／relax（放鬆）／count（自動數）
let sess=null,tick=null,resume=null;
const SESS_KEY='rehab-sess';
const cur=()=>sess.items[sess.idx];
const isHold=it=>+it.hold>0;
const isTempo=it=>!isHold(it)&&+it.tempo>0;
const isAuto=it=>isHold(it)||isTempo(it);
const clock=s=>s>=60?`${Math.floor(s/60)}:${pad(s%60)}`:`${s}<small>秒</small>`;
function stopTick(){clearInterval(tick);tick=null}
function startTick(){stopTick();tick=setInterval(onTick,200)}
function saveSess(){if(sess&&sess.phase!=='done'){sess.savedAt=Date.now();lsSet(SESS_KEY,sess)}}
function clearSess(){lsDel(SESS_KEY)}
function loadResume(){
  const r=lsGet(SESS_KEY);resume=null;
  if(!r||!Array.isArray(r.items)||!r.items.length||r.phase==='done'||!r.start){clearSess();return}
  const any=(r.done||[]).some(d=>d>0)||r.rep>0||r.count>0;
  if(!any&&Date.now()-(r.savedAt||r.start)>3*3600e3){clearSess();return}
  resume=r;
}

function intro(it,first){
  const what=it.kind==='st'?'拉筋':'動作';
  const how=isHold(it)?(it.reps>1?`做${num(it.reps)}下，每下撐${num(it.hold)}秒`:`撐${fmtT(it.hold)}`):isTempo(it)?`做${num(it.reps)}下，每${num(it.tempo)}秒數一下`:`做${num(it.reps)}下`;
  return `${first?'開始。':''}${what}，${it.name||''}，${how}`;
}
function openSession(){
  document.body.classList.add('locked');window.scrollTo(0,0);
  $('#session').hidden=false;drawSession();
}
$('#startBtn').addEventListener('click',()=>{
  const p=activePlan();if(!p||!p.items.length)return;
  if(resume){addLog(makeEntry(resume,resume.savedAt||resume.start));resume=null} // 上次未做完嘅自動存低，唔會冇咗
  unlockAudio();keepAwake(true);
  const items=clone(p.items);
  sess={plan:p.name,planId:p.id,items,idx:0,set:1,rep:0,count:0,hp:'ready',done:items.map(()=>0),start:Date.now(),idle:0,phase:'work',confirm:false};
  openSession();
  say(intro(items[0],true));
});
function doResume(){
  const r=resume;resume=null;
  unlockAudio();keepAwake(true);
  sess=r;sess.idle=(+sess.idle||0)+Math.max(0,Date.now()-(r.savedAt||Date.now()));
  sess.confirm=false;
  if(sess.phase==='rest'&&sess.pending){sess.idx=sess.pending.idx;sess.set=sess.pending.set;sess.rep=0;sess.count=0}
  sess.pending=null;sess.phase='work';sess.hp='ready';
  openSession();
  say('繼續。'+intro(cur()));
}
function nextPos(){const it=cur();if(sess.set<it.sets)return{idx:sess.idx,set:sess.set+1};let i=sess.idx+1;while(i<sess.items.length&&!(sess.items[i].sets>0))i++;return i<sess.items.length?{idx:i,set:1}:null}
function completeSet(){
  stopTick();
  sess.done[sess.idx]=Math.max(sess.done[sess.idx]||0,sess.set);
  const nx=nextPos();
  if(!nx){finish(true);return}
  sess.pending=nx;
  const rest=+cur().rest||0;
  if(rest<=0){goTo(nx,true,S.autoNext);return}
  sess.phase='rest';sess.restTotal=rest;sess.restEnd=Date.now()+rest*1000;sess.lastSec=null;
  beep(660,120);startTick();drawSession();
}
function goTo(nx,speak,auto){
  stopTick();
  const changed=nx.idx!==sess.idx;
  sess.idx=nx.idx;sess.set=nx.set;sess.phase='work';sess.pending=null;sess.rep=0;sess.count=0;sess.hp='ready';
  drawSession();
  if(speak)say(changed?'下一個'+intro(cur()):`開始第${num(sess.set)}組，${cur().name||''}`);
  if(auto&&isAuto(cur()))startPrep(false);
}
// 撳「開始」之後：先準備倒數（設定入面揀幾秒），再開始撐／自動數
function startPrep(speak){
  const it=cur();if(!isAuto(it))return;
  stopTick();
  const n=+S.prep||0;
  if(n<=0){begin();return}
  sess.hp='prep';sess.tEnd=Date.now()+n*1000;sess.lastSec=null;
  if(speak)say('準備');
  startTick();drawSession();
}
function begin(){if(isHold(cur()))startHold();else startCount()}
function startHold(){
  const it=cur();sess.hp='hold';sess.tEnd=Date.now()+it.hold*1000;sess.lastSec=null;
  beep(880,200);startTick();drawSession();
}
function startCount(){
  const it=cur();sess.hp='count';sess.tEnd=Date.now()+it.tempo*1000;sess.lastSec=null;
  beep(880,200);startTick();drawSession();
}
function restDone(){
  beep(988,450);setTimeout(()=>beep(988,450),550);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  const nx=sess.pending,changed=nx.idx!==sess.idx;
  goTo(nx,false,S.autoNext);
  say('休息完喇。'+(changed?'下一個'+intro(cur()):`開始第${num(nx.set)}組`));
}
function onTick(){
  if(!sess)return stopTick();
  const now=Date.now();
  if(sess.phase==='rest'){
    const left=Math.ceil((sess.restEnd-now)/1000);
    if(left<=0){restDone();return}
    if(left!==sess.lastSec){sess.lastSec=left;if(left<=3)beep(740,120);else if(left===10&&sess.restTotal>=30)say('仲有十秒');updateDial(left)}
    return;
  }
  const hp=sess.hp;
  if(sess.phase!=='work'||!['prep','hold','relax','count'].includes(hp))return;
  const it=cur();const left=Math.ceil((sess.tEnd-now)/1000);
  if(left<=0){
    if(hp==='prep'){begin();return}
    if(hp==='relax'){startHold();return}
    if(hp==='hold'){
      sess.rep++;beep(523,300);
      if(sess.rep>=it.reps){say(it.reps>1?`${num(sess.rep)}，呢組完成`:'時間到，做得好');completeSet();return}
      say(num(sess.rep));
      const rl=+it.relax||0;
      sess.hp=rl>0?'relax':'hold';sess.tEnd=now+(rl>0?rl:it.hold)*1000;sess.lastSec=null;drawSession();return;
    }
    if(hp==='count'){
      sess.count++;
      if(sess.count>=it.reps){beep(523,300);say(`${num(sess.count)}，呢組完成`);completeSet();return}
      beep(880,80);say(num(sess.count));
      sess.tEnd+=it.tempo*1000;if(sess.tEnd<=now)sess.tEnd=now+it.tempo*1000;
      sess.lastSec=null;drawSession();return;
    }
  }
  if(left!==sess.lastSec){
    sess.lastSec=left;
    const t=$('#holdT');if(t&&hp!=='count')t.innerHTML=clock(left);
    if(hp==='prep'&&left<=3)beep(740,100);
    if(hp==='hold'){
      if(it.hold>90&&left===60)say('仲有一分鐘');
      else if(it.hold>45&&left===30)say('仲有三十秒');
      else if(it.hold>=20&&left===10)say('仲有十秒');
      if(it.hold>=10&&left<=3)beep(740,100);
    }
  }
}
function updateDial(left){
  const t=$('#dialT');if(!t)return;
  t.textContent=left>=60?`${Math.floor(left/60)}:${pad(left%60)}`:left;
  const c=$('#dialC');const L=2*Math.PI*45;c.style.strokeDashoffset=L*(1-left/sess.restTotal);
}
function finish(complete){
  stopTick();keepAwake(false);clearSess();
  sess.end=Date.now();
  const any=addLog(makeEntry(sess,sess.end));
  sess.phase='done';sess.saved=any;sess.complete=complete;drawSession();
  if(complete)say('全部完成，做得好！');
}
function closeSession(){
  stopTick();keepAwake(false);clearSess();
  sess=null;document.body.classList.remove('locked');$('#session').hidden=true;$('#session').classList.remove('resting');render();
  if(pendingVer)setTimeout(()=>applyUpdate(false),300);
}
function progBar(){return `<div class="prog">${sess.items.map((it,k)=>Array.from({length:+it.sets||0},(_,s)=>`<i class="${s<sess.done[k]?'d':(k===sess.idx&&s===sess.set-1&&sess.phase==='work')?'c':''}"></i>`).join('')).join('')}</div>`}
function drawSession(){
  const el=$('#session');
  if(!sess){el.hidden=true;return}
  saveSess();
  el.classList.toggle('resting',sess.phase==='rest');
  const it=cur();
  const top=`<div class="s-top"><div class="sub">${esc(sess.plan)}</div>${sess.phase!=='done'?`<button class="btn small" data-s="ask">結束</button>`:''}</div>${progBar()}
   ${sess.confirm?`<div class="confirm" style="margin-top:.6rem"><div>提早結束？已做嘅組數會記錄低。</div><div class="row"><button class="btn small danger" data-s="end">儲存並結束</button><button class="btn small" data-s="cancel">繼續做</button></div></div>`:''}`;
  if(sess.phase==='work'){
    const setDots=it.sets>1?`<div class="sets" aria-label="第 ${sess.set} 組，共 ${it.sets} 組">${Array.from({length:it.sets},(_,s)=>`<b class="${s<sess.set-1?'d':s===sess.set-1?'c':''}">${s+1}</b>`).join('')}</div>`:'';
    const setTxt=it.sets>1?`第 ${sess.set} / ${it.sets} 組`:'';
    const st=sess.hp;
    const tLeft=st==='ready'?it.hold:Math.max(0,Math.ceil((sess.tEnd-Date.now())/1000));
    let mid,btns,tap=false;
    if(!isAuto(it)){
      tap=true;
      mid=`<div class="s-state tap">撳畫面任何位置加一下</div><div class="s-big hold">${sess.count}<small>/ ${it.reps} 下</small></div>
        ${setTxt?`<div class="s-sub">${setTxt}</div>`:''}${setDots}`;
      btns=`<button class="btn primary" data-s="tap">＋1 下</button><div class="two"><button class="btn" data-s="minus" ${sess.count?'':'disabled'}>−1 撳錯</button><button class="btn" data-s="done">呢組做完</button><button class="btn" data-s="skip">跳過</button></div>`;
    }else if(isHold(it)){
      tap=st==='ready';
      const stateTxt=st==='prep'?'準備':st==='hold'?(it.kind==='st'?'拉住':'撐住'):st==='relax'?'放鬆':'準備好就撳畫面開始';
      mid=`<div class="s-state ${st}">${stateTxt}</div><div class="s-big ${st}" id="holdT">${clock(tLeft)}</div>
        ${it.reps>1?`<div class="s-sub">第 <b>${Math.min(sess.rep+(st==='relax'?0:1),it.reps)}</b> / ${it.reps} 下${setTxt?` · ${setTxt}`:''}</div>`:setTxt?`<div class="s-sub">${setTxt}</div>`:''}${setDots}`;
      const go=it.kind==='st'?'開始拉':'開始撐';
      btns=st==='ready'?`<button class="btn primary" data-s="start">${sess.rep>0?'繼續':go} ${it.hold>=60?fmtT(it.hold):it.hold+' 秒'}</button>`
        :`<button class="btn" data-s="pause">暫停</button>`;
      btns+=`<div class="two"><button class="btn" data-s="done">呢組做完</button><button class="btn" data-s="skip">跳過</button></div>`;
    }else{
      tap=st==='ready';
      const stateTxt=st==='prep'?'準備':st==='count'?`自動數緊 · 每 ${it.tempo} 秒一下`:'準備好就撳畫面開始';
      mid=`<div class="s-state ${st==='count'?'hold':st==='prep'?'prep':'tap'}">${stateTxt}</div>
        ${st==='prep'?`<div class="s-big prep" id="holdT">${clock(tLeft)}</div><div class="s-sub">已做 ${sess.count} / ${it.reps} 下</div>`
          :`<div class="s-big hold">${sess.count}<small>/ ${it.reps} 下</small></div>`}
        ${setTxt?`<div class="s-sub">${setTxt}</div>`:''}${setDots}`;
      btns=st==='ready'?`<button class="btn primary" data-s="start">${sess.count>0?'繼續':'開始'}自動數（每 ${it.tempo} 秒）</button>`
        :`<button class="btn" data-s="pause">暫停</button>`;
      btns+=`<div class="two"><button class="btn" data-s="done">呢組做完</button><button class="btn" data-s="skip">跳過</button></div>`;
    }
    el.innerHTML=`${top}<div class="s-main${tap?' tapzone':''}"${tap?' data-s="tap"':''}>
      <div class="s-label">${kindName(it.kind)} · 第 ${sess.idx+1} / ${sess.items.length} 項</div>
      ${it.pic?`<div class="s-pic">${pic(it.pic)}</div>`:''}
      <div class="s-name">${esc(it.name||'未命名')}</div>
      ${mid}
      ${it.note?`<div class="s-note">${esc(it.note)}</div>`:''}
    </div><div class="s-bottom">${btns}</div>`;
  }else if(sess.phase==='rest'){
    const nx=sess.pending,ni=sess.items[nx.idx];const L=2*Math.PI*45;
    const autoTxt=S.autoNext&&isAuto(ni)?`<div class="s-sub">休息完自動開始${S.prep?`（準備 ${S.prep} 秒）`:''}</div>`:'';
    el.innerHTML=`${top}<div class="s-main">
      <div class="s-label">休息</div>
      <div class="dial"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" style="stroke:var(--line)" stroke-width="6"></circle><circle id="dialC" cx="50" cy="50" r="45" fill="none" style="stroke:var(--rest)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="0"></circle></svg><div class="t" id="dialT"></div></div>
      <div class="s-sub">跟住：${nx.set===1?`下一個${kindName(ni.kind)} · <b>${esc(ni.name||'未命名')}</b>`:`第 ${nx.set} 組 · ${esc(ni.name||'')}`}</div>
      ${autoTxt}
      ${nx.set===1&&ni.pic?`<div class="s-pic" style="opacity:.85">${pic(ni.pic)}</div>`:''}
    </div>
    <div class="s-bottom"><div class="two"><button class="btn" data-s="plus">＋30 秒</button><button class="btn rest" data-s="go">唔休息，即刻做</button></div></div>`;
    updateDial(Math.ceil((sess.restEnd-Date.now())/1000));
  }else{
    const done=sess.done.reduce((a,b)=>a+(b||0),0),tot=sess.items.reduce((a,i)=>a+(+i.sets||0),0);
    const mins=Math.max(1,Math.round(((sess.end||Date.now())-sess.start-(sess.idle||0))/60000));
    el.innerHTML=`${top}<div class="s-main">
      <div class="s-label">${sess.complete?'完成':'已結束'}</div>
      <div class="s-name">${sess.complete?'全部做完，做得好！':'今日做咗一部分'}</div>
      <div class="s-big">${done}<small>/ ${tot} 組</small></div>
      <div class="sub">用咗 ${mins} 分鐘${sess.saved?' · 已記錄':''}</div>
    </div><div class="s-bottom"><button class="btn primary" data-s="close">返主頁</button></div>`;
  }
}
function addRep(){
  const it=cur();if(sess.phase!=='work')return;
  sess.count++;
  if(sess.count>=it.reps){beep(523,300);say(`${num(sess.count)}，呢組完成`);completeSet();return}
  beep(880,80);say(num(sess.count));drawSession();
}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{if(e.target.closest('#session'))e.preventDefault()});
$('#session').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b||!sess)return;const a=b.dataset.s;
  if(a==='tap'){if(sess.phase!=='work')return;if(isAuto(cur())){if(sess.hp==='ready')startPrep(true)}else addRep()}
  else if(a==='start'){if(sess.hp==='ready')startPrep(true)}
  else if(a==='minus'){sess.count=Math.max(0,sess.count-1);drawSession()}
  else if(a==='done')completeSet();
  else if(a==='pause'){stopTick();sess.hp='ready';drawSession()}
  else if(a==='skip'){stopTick();sess.set=cur().sets;const nx=nextPos();if(nx)goTo(nx,true,false);else finish(false)}
  else if(a==='plus'){sess.restEnd+=30000;sess.restTotal+=30;updateDial(Math.ceil((sess.restEnd-Date.now())/1000));saveSess()}
  else if(a==='go'){goTo(sess.pending,true,true)}
  else if(a==='ask'){sess.confirm=true;drawSession()}
  else if(a==='cancel'){sess.confirm=false;drawSession()}
  else if(a==='end'){sess.confirm=false;finish(false)}
  else if(a==='close'){closeSession()}
});
// App 轉去背景（或者被 iPhone 閂咗）之前：即刻存低資料同做緊嘅進度
function persistNow(){flushSaves();saveSess()}
window.addEventListener('pagehide',persistNow);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){persistNow();return}
  if(sess&&sess.phase!=='done')keepAwake(true);
  setTimeout(()=>checkUpdate(false),800);
});

/* ---------- backup ---------- */
let pendingImport=null;
function bkMsg(html){const m=$('#bkMsg');if(m)m.innerHTML=html}
async function exportBackup(){
  flushSaves();
  const d=new Date(),name=`rehab-backup-${dayKey(d.getTime())}.json`; // 英文檔名：中文檔名有啲瀏覽器下載會變「download」
  const json=JSON.stringify({app:'復康運動',ver:VER,exported:d.toISOString(),state:S,hist:H});
  const done=how=>{S.lastBackup=Date.now();queueSave('state');renderSet();bkMsg(`<div class="ok">已匯出（${H.log.length} 次紀錄）。${how}</div>`)};
  let file=null;
  try{file=new File([json],name,{type:'application/json'})}catch(e){}
  if(file&&navigator.canShare&&navigator.share){
    try{if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'復康運動備份'});done('建議揀「儲存到檔案」放入 iCloud Drive。');return}}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  try{
    const url=URL.createObjectURL(file||new Blob([json],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);done('檔案喺「下載」資料夾。');
  }catch(e){bkMsg('<div class="warn">匯出唔到，請用 Safari 開網址再試。</div>')}
}
function pickImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)readImport(f)};inp.click();
}
function readImport(f){
  const bad=()=>bkMsg('<div class="warn">讀唔到呢個檔，請揀匯出嘅備份檔（rehab-backup-日期.json）。</div>');
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result)}catch(e){bad();return}
    if(!d||!d.state||!Array.isArray(d.state.plans)){bad();return}
    const log=d.hist&&Array.isArray(d.hist.log)?d.hist.log.filter(l=>l&&l.t&&Array.isArray(l.items)):[];
    pendingImport={state:d.state,log};
    const when=d.exported?new Date(d.exported).toLocaleDateString('zh-HK',{year:'numeric',month:'long',day:'numeric'}):'未知日期';
    bkMsg(`<div class="confirm"><div>備份日期：${esc(when)}，有 ${d.state.plans.length} 個計劃、${log.length} 次紀錄。<br>計劃同設定會換成備份入面嘅；紀錄會合併，唔會重複，亦唔會刪走而家嘅紀錄。</div>
      <div class="row"><button class="btn small primary" data-act="impok">匯入</button><button class="btn small" data-act="impno">取消</button></div></div>`);
  };
  r.onerror=bad;r.readAsText(f);
}
function applyImport(){
  const im=pendingImport;if(!im)return;pendingImport=null;
  const keepBackup=S.lastBackup;
  S=Object.assign({plans:[],activeId:null,big:false},clone(im.state));
  S.lastBackup=Math.max(+S.lastBackup||0,+keepBackup||0);
  const m=new Map();[...H.log,...clone(im.log)].forEach(l=>m.set(l.t,l));
  H.log=[...m.values()].sort((a,b)=>b.t-a.t).slice(0,LOG_MAX);
  norm();applyFont();queueSave('state');queueSave('hist');renderSet();
  bkMsg(`<div class="ok">已匯入：${S.plans.length} 個計劃、${H.log.length} 次紀錄。</div>`);
}

/* ---------- auto update（GitHub Pages：手機主畫面 App 唔會自己攞新版） ---------- */
const VER=window.__REHAB_VER||'dev';
let pendingVer=null,lastCheck=0;
const canCheck=()=>/^https?:$/.test(location.protocol)&&!window.claude&&VER!=='dev';
function updMsg(t){const m=$('#updMsg');if(m)m.textContent=t}
async function checkUpdate(manual){
  if(!canCheck()){if(manual)updMsg('呢個開法唔使檢查更新。');return}
  if(!manual&&Date.now()-lastCheck<20000)return;
  lastCheck=Date.now();
  if(manual)updMsg('檢查緊有冇新版本…');
  try{
    const base=location.origin+location.pathname;
    const r=await fetch(base+'?vcheck='+Date.now(),{cache:'no-store'});
    const m=(await r.text()).match(new RegExp("__REHAB"+"_VER='([0-9A-Za-z-]+)'"));
    if(!m){if(manual)updMsg('暫時連唔到 GitHub，遲啲再試。');return}
    if(m[1]===VER){if(manual)updMsg('已經係最新版本。');return}
    pendingVer=m[1];
    if(manual)updMsg('搵到新版本，即刻更新！');
    applyUpdate(manual);
  }catch(e){if(manual)updMsg('暫時連唔到 GitHub，遲啲再試。')}
}
function applyUpdate(manual){
  if(!pendingVer)return;
  if(sess){if(manual)updMsg('做完運動先更新。');return} // 做緊運動唔好重新載入
  try{
    const last=JSON.parse(sessionStorage.getItem('rehab-upd')||'null');
    if(!manual&&last&&last.v===pendingVer&&Date.now()-last.t<120000)return; // 防止不停重新載入
    sessionStorage.setItem('rehab-upd',JSON.stringify({v:pendingVer,t:Date.now()}));
  }catch(e){}
  flushSaves();
  location.replace(location.origin+location.pathname+'?v='+encodeURIComponent(pendingVer));
}
setTimeout(()=>checkUpdate(false),1500);
setInterval(()=>{if(document.visibilityState==='visible')checkUpdate(false)},5*60*1000);

initStore();
})();
